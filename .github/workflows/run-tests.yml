name: Run tests

on:
  push:
  pull_request:

jobs:
  run-tests:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Start Jetty server
        run: nohup mvn jetty:run -DskipTests > jetty.log 2>&1 &

      - name: Wait for Jetty
        run: |
          echo "Waiting for Jetty to start..."
          for i in {1..20}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "Jetty started!"
              break
            fi
            echo "Waiting..."
            sleep 3
          done

      - name: Run tests and generate report
        env:
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          USER_NEW_PASSWORD: ${{ secrets.USER_NEW_PASSWORD }}
        run: |
          mvn test
          mvn allure:report
        continue-on-error: true

      - name: Publish test results as artifacts
        uses: actions/upload-artifact@v4
        with:
            name: allure-report
            path: target/allure-report
